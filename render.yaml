services:
  # Backend Web Service
  - type: web
    name: nexora-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend Static Site
  - type: web
    name: nexora-frontend
    runtime: static
    plan: free
    rootDir: frontend
    staticPublishPath: .